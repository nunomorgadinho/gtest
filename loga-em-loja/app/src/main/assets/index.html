<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loga em Loja</title>
<style>
:root{
  --pri:#C2410C; --pri-d:#7C2D12; --acc:#F59E0B; --bg:#FFF7ED; --card:#fff;
  --tx:#1C1917; --mut:#78716C; --ln:#E7E5E4; --ok:#15803D;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Roboto,sans-serif}
button{font:inherit;cursor:pointer;border:0}
input,select,textarea{font:inherit}
header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#EA580C,var(--pri-d));color:#fff;padding:14px 16px 12px}
.top{display:flex;align-items:center;gap:10px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px;flex:1}
.logo small{display:block;font-weight:500;font-size:11px;opacity:.85;letter-spacing:.3px}
.iconbtn{position:relative;background:rgba(255,255,255,.18);color:#fff;width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
.badge{position:absolute;top:-4px;right:-4px;background:var(--acc);color:#1C1917;font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 4px}
.search{margin-top:12px;display:flex;background:#fff;border-radius:12px;padding:0 12px;align-items:center;gap:8px}
.search input{flex:1;border:0;outline:0;padding:11px 0;background:transparent;color:var(--tx)}
main{padding:14px 16px 96px}
.hero{background:linear-gradient(120deg,#FDBA74,#FB923C);border-radius:18px;padding:18px;color:#431407;margin-bottom:16px;position:relative;overflow:hidden}
.hero h2{margin:0 0 4px;font-size:20px}
.hero p{margin:0;font-size:14px;padding-right:70px}
.hero .tag{display:inline-block;margin-top:10px;background:#431407;color:#FED7AA;font-weight:700;font-size:13px;padding:6px 10px;border-radius:8px}
.hero .big{position:absolute;right:-6px;bottom:-14px;font-size:84px;opacity:.9}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;background:#fff;border:1px solid var(--ln);padding:8px 14px;border-radius:20px;font-size:14px;color:var(--tx)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;flex-direction:column}
.thumb{height:110px;display:grid;place-items:center;font-size:56px}
.card .b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .n{font-weight:600;font-size:14px;line-height:1.25}
.card .c{font-size:12px;color:var(--mut)}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px}
.price{font-weight:800;color:var(--pri)}
.old{font-size:12px;color:var(--mut);text-decoration:line-through;margin-left:4px;font-weight:400}
.add{background:var(--pri);color:#fff;width:34px;height:34px;border-radius:10px;font-size:20px;line-height:1}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.sec-t{display:flex;justify-content:space-between;align-items:baseline;margin:4px 0 10px}
.sec-t h3{margin:0;font-size:17px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--ln);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;position:relative}
nav button .ic{font-size:21px}
nav button.on{color:var(--pri);font-weight:700}
nav .badge{top:0;right:calc(50% - 22px)}
.view{display:none}.view.on{display:block}
/* detalhe */
.det .thumb{height:220px;border-radius:18px;font-size:120px}
.det h2{margin:16px 0 4px}
.det .price{font-size:24px}
.det p{color:#44403C;line-height:1.5}
.qty{display:inline-flex;align-items:center;background:#fff;border:1px solid var(--ln);border-radius:12px}
.qty button{background:none;width:38px;height:38px;font-size:20px;color:var(--pri)}
.qty span{min-width:28px;text-align:center;font-weight:700}
.btn{display:block;width:100%;background:var(--pri);color:#fff;padding:14px;border-radius:14px;font-weight:700;font-size:16px;text-align:center}
.btn.sec{background:#fff;color:var(--pri);border:1.5px solid var(--pri)}
.back{background:none;color:var(--pri);font-weight:600;padding:0;margin-bottom:10px}
/* carrinho */
.line{display:flex;gap:12px;background:#fff;border-radius:14px;padding:10px;margin-bottom:10px;align-items:center}
.line .thumb{width:60px;height:60px;border-radius:12px;font-size:32px;flex:none}
.line .info{flex:1;min-width:0}
.line .n{font-weight:600;font-size:14px}
.line .rm{background:none;color:var(--mut);font-size:12px;padding:4px 0}
.sum{background:#fff;border-radius:14px;padding:14px;margin:14px 0}
.sum div{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.sum .tot{font-weight:800;font-size:18px;border-top:1px dashed var(--ln);margin-top:6px;padding-top:10px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--ln);border-radius:12px;background:#fff;outline-color:var(--pri)}
.pay{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.pay label{background:#fff;border:1.5px solid var(--ln);border-radius:12px;padding:10px 4px;text-align:center;font-size:12px;font-weight:600}
.pay input{display:none}
.pay input:checked+span{color:var(--pri)}
.pay label:has(input:checked){border-color:var(--pri);background:#FFF7ED}
.pay .ic{display:block;font-size:22px}
.order{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px}
.order .h{display:flex;justify-content:space-between;font-weight:700}
.order .s{font-size:12px;color:var(--ok);font-weight:700;background:#DCFCE7;padding:3px 8px;border-radius:8px}
.order .d{font-size:13px;color:var(--mut);margin-top:4px}
.ok{text-align:center;padding:30px 10px}
.ok .big{font-size:72px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:#1C1917;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.fav{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.9);width:32px;height:32px;border-radius:50%;font-size:16px}
.rel{position:relative}
.info-card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;font-size:14px;line-height:1.5}
.info-card h4{margin:0 0 6px}
.hint{text-align:center;font-size:14px;color:var(--mut)}.hint a{color:var(--pri);font-weight:700}
.seg{display:flex;background:#fff;border:1px solid var(--ln);border-radius:14px;padding:4px;margin-bottom:16px}
.seg button{flex:1;background:none;padding:10px;border-radius:10px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--pri);color:#fff}
.team{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team button{background:#fff;border:1.5px solid var(--ln);border-radius:14px;padding:14px 8px;font-weight:600;font-size:14px;color:var(--tx)}
.team button span{display:block;font-size:28px;margin-bottom:4px}
.team button.on{border-color:var(--pri);background:#FFF7ED;color:var(--pri)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stats div{background:#fff;border-radius:14px;padding:14px}
.stats b{display:block;font-size:20px;color:var(--pri)}.stats span{font-size:12px;color:var(--mut)}
.prow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:10px;margin-bottom:8px}
.prow .pe{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:24px;background:#F5F5F4;flex:none}
.prow .pi{flex:1;min-width:0;display:flex;flex-direction:column;font-size:14px}
.prow .pi span{font-size:12px;color:var(--mut)}
.mini{background:#fff;border:1.5px solid var(--pri);color:var(--pri);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:600}
.mini.del{border-color:#FCA5A5;color:#B91C1C}
.mini-sel{border:1px solid var(--ln);border-radius:10px;padding:7px;background:#fff;font-size:13px}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo">Loga em Loja<small>Tudo o que precisa, numa só loja</small></div>
    <button class="iconbtn" onclick="go('carrinho')" aria-label="Carrinho">🛒<span class="badge" id="hb" hidden>0</span></button>
  </div>
  <div class="search" id="searchBox">🔍<input id="q" type="search" placeholder="Procurar produtos..." oninput="renderLoja()"></div>
</header>

<main>
  <section class="view on" id="v-loja"></section>
  <section class="view" id="v-produto"></section>
  <section class="view" id="v-favoritos"></section>
  <section class="view" id="v-carrinho"></section>
  <section class="view" id="v-checkout"></section>
  <section class="view" id="v-conta"></section>
</main>

<nav>
  <button data-v="loja" class="on" onclick="go('loja')"><span class="ic">🏠</span>Loja</button>
  <button data-v="favoritos" onclick="go('favoritos')"><span class="ic">♥</span>Favoritos</button>
  <button data-v="carrinho" onclick="go('carrinho')"><span class="ic">🛒</span>Carrinho<span class="badge" id="nb" hidden>0</span></button>
  <button data-v="conta" onclick="go('conta')"><span class="ic">👤</span>Conta</button>
</nav>
<div class="toast" id="toast"></div>

<script>
const CATS = ["Todos","Mercearia","Casa","Moda","Tecnologia","Beleza","Desporto"];
const BG = {Mercearia:"#DCFCE7",Casa:"#E0F2FE",Moda:"#FCE7F3",Tecnologia:"#EDE9FE",Beleza:"#FEF3C7",Desporto:"#FFE4E6"};
const P0 = [
 {id:1,n:"Azeite Extra Virgem 75cl",c:"Mercearia",p:7.49,o:8.99,e:"🫒",d:"Azeite português de primeira pressão a frio, sabor frutado e equilibrado."},
 {id:2,n:"Café em Grão 1kg",c:"Mercearia",p:14.90,e:"☕",d:"Blend de arábica e robusta, torra média, ideal para expresso."},

 {id:9,n:"T-shirt Algodão Orgânico",c:"Moda",p:15.00,e:"👕",d:"100% algodão orgânico, corte regular, disponível em várias cores."},

 {id:17,n:"Creme Hidratante",c:"Beleza",p:12.90,e:"🧴",d:"Com ácido hialurónico, para todos os tipos de pele."},
 {id:18,n:"Perfume Floral 50ml",c:"Beleza",p:45.00,e:"🌸",d:"Notas de jasmim, flor de laranjeira e baunilha."},
 {id:19,n:"Sabonete Artesanal",c:"Beleza",p:4.50,e:"🧼",d:"Feito com azeite e lavanda, produção local."},
 {id:20,n:"Tapete de Yoga",c:"Desporto",p:22.90,e:"🧘",d:"Antiderrapante, 6 mm de espessura, com alça."},
 {id:21,n:"Bola de Futebol",c:"Desporto",p:18.00,e:"⚽",d:"Tamanho 5, costura térmica para maior durabilidade."},
 {id:22,n:"Garrafa Térmica 750ml",c:"Desporto",p:16.90,o:21.90,e:"🥤",d:"Mantém frio 24 h e quente 12 h, sem BPA."},
 {id:23,n:"Bicicleta Urbana",c:"Desporto",p:349.00,e:"🚲",d:"Quadro em alumínio, 7 velocidades, cesto incluído."},
 {id:24,n:"Halteres 2×5 kg",c:"Desporto",p:34.90,e:"🏋️",d:"Revestimento em neopreno, pega antiderrapante."}
];
const PORTES_GRATIS = 50, PORTES = 3.99;

const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let P=load("le_products",P0);
let cart=load("le_cart",{}), favs=load("le_favs",[]), orders=load("le_orders",[]), user=load("le_user",{nome:"",email:"",tel:"",morada:"",cp:"",cidade:""});
let contas=load("le_accounts",[]), sessao=load("le_session",null);
let cat="Todos", hist=[], cur="loja", curProd=null, cupao=null;
let contaModo="entrar", painelTab="resumo", editProd=null;

/* --- Autenticação --- */
function sha256(s){
  const K=[],H=[];let n=2,c=0;
  const pr=x=>{for(let i=2;i*i<=x;i++)if(x%i==0)return false;return true};
  while(c<64){if(pr(n)){if(c<8)H[c]=(Math.pow(n,1/2)*4294967296)|0;K[c++]=(Math.pow(n,1/3)*4294967296)|0}n++}
  const b=unescape(encodeURIComponent(s)),l=b.length,w=[];
  for(let i=0;i<l;i++)w[i>>2]|=b.charCodeAt(i)<<(24-(i%4)*8);
  w[l>>2]|=0x80<<(24-(l%4)*8); w[(((l+8)>>6)+1)*16-1]=l*8;
  const r=(x,y)=>(x>>>y)|(x<<(32-y));
  for(let j=0;j<w.length;j+=16){
    const W=[];for(let i=0;i<16;i++)W[i]=w[j+i]|0;
    let [a,bb,cc,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){
      if(i>=16){const x=W[i-15],y=W[i-2];W[i]=(W[i-16]+(r(x,7)^r(x,18)^(x>>>3))+W[i-7]+(r(y,17)^r(y,19)^(y>>>10)))|0}
      const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+W[i])|0;
      const t2=((r(a,2)^r(a,13)^r(a,22))+((a&bb)^(a&cc)^(bb&cc)))|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=cc;cc=bb;bb=a;a=(t1+t2)|0;
    }
    [a,bb,cc,d,e,f,g,h].forEach((v,i)=>H[i]=(H[i]+v)|0);
  }
  return H.map(v=>(v>>>0).toString(16).padStart(8,"0")).join("");
}
const norm=s=>String(s||"").trim().toLowerCase().replace(/\s+/g," ");
// Credenciais da equipa guardadas apenas como hash (não aparecem em texto no código)
const CHEFE_H="828017677fe3dfc3a0a6502fe804ad05acccad8ee06768971b1435b69a245294";
const ADMIN_H="f74b45d638bfa01cf536449333ba09aca7800b575a65f50059c5470563e25878";
function setSessao(s){sessao=s;save("le_session",s);updNav()}
function sair(){setSessao(null);contaModo="entrar";toast("Sessão terminada");renderConta()}
function updNav(){
  const b=document.querySelector('nav button[data-v="conta"]');
  const ic=!sessao?"👤":sessao.tipo==="chefe"?"👑":sessao.tipo==="admin"?"🛠️":"😊";
  const lb=!sessao?"Entrar":sessao.tipo==="chefe"?"Chefe":sessao.tipo==="admin"?"Admin":"Conta";
  b.innerHTML=`<span class="ic">${ic}</span>${lb}`;
}
function contaAtual(){return sessao&&sessao.tipo==="cliente"?contas.find(c=>c.email===sessao.email):null}
const orderItems=o=>Array.isArray(o.itens)?o.itens:Object.entries(o.itens).map(([id,q])=>{const p=byId(+id)||{};return {id:+id,n:p.n||"Produto removido",e:p.e||"📦",p:p.p||0,q}});
const ESTADOS=["Confirmada","Em preparação","Enviada","Entregue","Cancelada"];
const ESTADO_COR={"Confirmada":"#DCFCE7|#15803D","Em preparação":"#FEF3C7|#B45309","Enviada":"#E0F2FE|#0369A1","Entregue":"#EDE9FE|#6D28D9","Cancelada":"#FEE2E2|#B91C1C"};
function estadoTag(e){e=e||"Confirmada";const [bg,fg]=(ESTADO_COR[e]||ESTADO_COR.Confirmada).split("|");return `<span class="s" style="background:${bg};color:${fg}">${e}</span>`}

const eur = v => v.toLocaleString("pt-PT",{style:"currency",currency:"EUR"});
const byId = id => P.find(p=>p.id===id);
const esc = s => String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("on");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("on"),1800)}

function go(v,push=true){
  if(push && v!==cur) hist.push(cur);
  cur=v;
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  document.getElementById("searchBox").style.display = v==="loja"?"flex":"none";
  ({loja:renderLoja,produto:renderProduto,favoritos:renderFavs,carrinho:renderCart,checkout:renderCheckout,conta:renderConta})[v]();
  window.scrollTo(0,0);
}
window.voltar=function(){ if(!hist.length) return false; go(hist.pop(),false); return true; };

function count(){return Object.values(cart).reduce((a,b)=>a+b,0)}
function updBadges(){const n=count();["hb","nb"].forEach(i=>{const b=document.getElementById(i);b.hidden=!n;b.textContent=n})}
function addCart(id,q=1){cart[id]=(cart[id]||0)+q;save("le_cart",cart);updBadges();toast("Adicionado ao carrinho ✓")}
function setQty(id,q){if(q<=0)delete cart[id];else cart[id]=q;save("le_cart",cart);updBadges();renderCart()}
function toggleFav(id,ev){if(ev)ev.stopPropagation();const i=favs.indexOf(id);i<0?favs.push(id):favs.splice(i,1);save("le_favs",favs);toast(i<0?"Guardado nos favoritos ♥":"Removido dos favoritos");if(cur==="loja")renderLoja();else if(cur==="favoritos")renderFavs();else if(cur==="produto")renderProduto()}
function abrir(id){curProd=id;go("produto")}

function card(p){
  return `<div class="card rel" onclick="abrir(${p.id})">
    <div class="thumb" style="background:${BG[p.c]}">${p.e}</div>
    <button class="fav" onclick="toggleFav(${p.id},event)" aria-label="Favorito">${favs.includes(p.id)?"❤️":"🤍"}</button>
    <div class="b"><div class="n">${esc(p.n)}</div><div class="c">${p.c}</div>
      <div class="row"><span class="price">${eur(p.p)}${p.o?`<span class="old">${eur(p.o)}</span>`:""}</span>
      <button class="add" onclick="event.stopPropagation();addCart(${p.id})" aria-label="Adicionar">+</button></div></div></div>`;
}

function renderLoja(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const list=P.filter(p=>(cat==="Todos"||p.c===cat)&&(!q||p.n.toLowerCase().includes(q)||p.c.toLowerCase().includes(q)));

function totals(){
  const sub=Object.entries(cart).reduce((a,[id,q])=>a+(byId(+id)?.p||0)*q,0);
  const desc=cupao==="BEMVINDO"?sub*0.10:0;
  const portes=sub===0||sub-desc>=PORTES_GRATIS?0:PORTES;
  return {sub,desc,portes,tot:sub-desc+portes};
}
function sumHtml(){
  const t=totals();
  return `<div class="sum"><div><span>Subtotal</span><span>${eur(t.sub)}</span></div>
    ${t.desc?`<div style="color:var(--ok)"><span>Desconto (BEMVINDO)</span><span>−${eur(t.desc)}</span></div>`:""}
    <div><span>Portes</span><span>${t.portes?eur(t.portes):"Grátis"}</span></div>
    <div class="tot"><span>Total</span><span>${eur(t.tot)}</span></div></div>`;
}
function applyCupao(){
  const v=document.getElementById("cp").value.trim().toUpperCase();
  if(v==="BEMVINDO"){cupao=v;toast("Cupão aplicado: −10%")}else{cupao=null;toast("Cupão inválido")}
  renderCart();
}
function renderCart(){
  const items=Object.entries(cart);

  const t=totals(); const falta=PORTES_GRATIS-(t.sub-t.desc);
  el.innerHTML=`<div class="sec-t"><h3>Carrinho</h3><span style="color:var(--mut);font-size:13px">${count()} artigos</span></div>
    ${items.map(([id,q])=>{const p=byId(+id);return `<div class="line">

      <button class="rm" onclick="setQty(${p.id},0)">Remover</button></div>
      <div class="qty"><button onclick="setQty(${p.id},${q-1})">−</button><span>${q}</span><button onclick="setQty(${p.id},${q+1})">+</button></div></div>`}).join("")}
    ${falta>0?`<div class="info-card" style="background:#FEF3C7">🚚 Faltam <b>${eur(falta)}</b> para portes grátis!</div>`:`<div class="info-card" style="background:#DCFCE7">🚚 Tem portes grátis!</div>`}
    <div style="display:flex;gap:8px"><div class="field" style="flex:1;margin:0"><input id="cp" placeholder="Código de desconto" value="${cupao||""}"></div><button class="btn sec" style="width:auto;padding:0 18px" onclick="applyCupao()">Aplicar</button></div>

function encomendar(ev){
  ev.preventDefault();
  const f=Object.fromEntries(new FormData(ev.target));
  user={nome:f.nome,email:f.email,tel:f.tel,morada:f.morada,cp:f.cp,cidade:f.cidade}; save("le_user",user);
  const ca=contaAtual();
  if(ca){Object.assign(ca,{nome:f.nome,tel:f.tel,morada:f.morada,cp:f.cp,cidade:f.cidade});save("le_accounts",contas)}
  const t=totals();
  const num="LE"+String(Date.now()).slice(-6);
  const itens=Object.entries(cart).map(([id,q])=>{const p=byId(+id);return p?{id:p.id,n:p.n,e:p.e,p:p.p,q}:null}).filter(Boolean);
  orders.unshift({num,data:new Date().toISOString(),itens,total:t.tot,pag:f.pag,estado:"Confirmada",
    cliente:{nome:f.nome,email:norm(ca?ca.email:f.email),tel:f.tel,morada:`${f.morada}, ${f.cp} ${f.cidade}`},conta:!!ca,notas:f.notas||""});
  save("le_orders",orders);
  cart={}; cupao=null; save("le_cart",cart); updBadges();
  hist=["loja"]; cur="checkout";
  document.getElementById("v-checkout").innerHTML=`<div class="ok"><div class="big">🎉</div><h2>Obrigado pela sua compra!</h2>
    <p>Encomenda <b>${num}</b> confirmada.<br>Total: <b>${eur(t.tot)}</b> · ${esc(f.pag)}</p>
    <p style="color:var(--mut);font-size:14px">${f.pag==="Multibanco"?"Entidade 12345 · Ref. "+num.slice(2)+" 000":f.pag==="MB WAY"?"Confirme o pagamento na app MB WAY.":"Pagamento processado."}</p>
    <br><button class="btn" onclick="hist=[];go('loja',false)">Continuar a comprar</button></div>`;
  window.scrollTo(0,0);
  return false;
}

function fdata(ev){ev.preventDefault();return Object.fromEntries(new FormData(ev.target))}
function entrarCliente(ev){
  const f=fdata(ev); const c=contas.find(c=>c.email===norm(f.email));
  if(!c||c.senha!==sha256(c.email+"|"+f.senha)){toast("Email ou palavra-passe incorretos");return false}
  setSessao({tipo:"cliente",email:c.email,nome:c.nome}); toast("Olá, "+c.nome.split(" ")[0]+"!"); renderConta(); return false;
}
function criarConta(ev){
  const f=fdata(ev); const email=norm(f.email);
  if(f.senha!==f.senha2){toast("As palavras-passe não coincidem");return false}
  if(contas.some(c=>c.email===email)){toast("Já existe uma conta com este email");return false}
  if(sha256(email)===CHEFE_H){toast("Este email está reservado");return false}
  const c={nome:f.nome.trim(),email,tel:f.tel||"",morada:"",cp:"",cidade:"",senha:sha256(email+"|"+f.senha),criada:new Date().toISOString()};
  contas.push(c); save("le_accounts",contas);
  setSessao({tipo:"cliente",email,nome:c.nome}); toast("Conta criada com sucesso ✓"); renderConta(); return false;
}
function entrarChefe(ev){
  const f=fdata(ev);
  if(sha256(norm(f.email))!==CHEFE_H){toast("Email do chefe incorreto");return false}
  painelTab="resumo"; setSessao({tipo:"chefe",nome:"Chefe"}); toast("Bem-vindo, Chefe 👑"); renderConta(); return false;
}
function entrarAdmin(ev){
  const f=fdata(ev);
  if(sha256(norm(f.empresa)+"|"+norm(f.chefe))!==ADMIN_H){toast("Empresa ou nome do chefe incorretos");return false}
  painelTab="encomendas"; setSessao({tipo:"admin",nome:"Administrador"}); toast("Bem-vindo, Administrador 🛠️"); renderConta(); return false;
}

    <div class="d">${it.map(i=>`${i.e} ${esc(i.n)} ×${i.q}`).join("<br>")}</div>

function guardarProd(ev){
  const f=fdata(ev);
  const dados={n:f.n.trim(),c:f.c,p:Math.round(parseFloat(f.p)*100)/100,e:f.e.trim()||"📦",d:f.d.trim()};
  const o=parseFloat(f.o); if(o>dados.p) dados.o=Math.round(o*100)/100;
  if(editProd==="novo"){dados.id=Math.max(0,...P.map(p=>p.id))+1;P.push(dados)}
  else{const i=P.findIndex(p=>p.id===editProd);dados.id=editProd;P[i]=dados}
  save("le_products",P); editProd=null; toast("Produto guardado ✓"); renderConta(); return false;
}
function removerProd(id){
  const p=byId(id); if(!p||!confirm(`Remover "${p.n}" da loja?`))return;
  P=P.filter(x=>x.id!==id); delete cart[id]; favs=favs.filter(x=>x!==id);
  save("le_products",P); save("le_cart",cart); save("le_favs",favs); updBadges(); toast("Produto removido"); renderConta();
}
function repor(){if(confirm("Repor os produtos originais? As alterações ao catálogo serão perdidas.")){P=JSON.parse(JSON.stringify(P0));save("le_products",P);toast("Catálogo reposto");renderConta()}}

Object.keys(cart).forEach(id=>{if(!byId(+id))delete cart[id]});
updNav(); updBadges(); renderLoja();
</script>
