plugins {
    id 'com.android.application'
}

android {
    namespace 'com.brincadeiras.eubrincoao'
    compileSdk 34

    defaultConfig {
        applicationId 'com.brincadeiras.eubrincoao'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Assinado com a chave de debug para poder ser instalado diretamente.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
