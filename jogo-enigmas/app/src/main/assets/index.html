<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sala dos Enigmas</title>
<style>
/* Layout: um ecrã de cada vez, cartão central com barra de estado no topo (vidas, nível, pontos) */
:root {
  --bg: #13212b;
  --bg-2: #1b2f3c;
  --panel: #213a49;
  --line: #2f4f62;
  --fg: #eef3f1;
  --muted: #9db3bd;
  --accent: #f2b544;
  --accent-ink: #2a1c00;
  --good: #4fc98a;
  --warn: #f2b544;
  --bad: #ef6a5b;
  --font: "Trebuchet MS", "Segoe UI", Roboto, system-ui, sans-serif;
  --mono: "Roboto Mono", "DejaVu Sans Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(120% 80% at 50% 0%, var(--bg-2), var(--bg) 70%);
  background-color: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 16px;
  user-select: none;
  -webkit-user-select: none;
  padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
  display: flex; flex-direction: column;
}
#app { flex: 1; display: flex; flex-direction: column; max-width: 480px; width: 100%; margin: 0 auto; padding-block: 12px 20px; gap: 14px; }

.hud { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-variant-numeric: tabular-nums; }
.hud-stats { flex: 1; min-width: auto; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.hud-stats[hidden] { display: none !important; }
.hud-tools { margin-left: auto; display: flex; gap: 6px; }
.lives { font-size: 18px; letter-spacing: 1px; white-space: nowrap; color: var(--bad); }
.lives .off { color: var(--line); }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; white-space: nowrap; font-size: 14px; color: var(--muted); }
.chip b { color: var(--fg); }

.screen { flex: 1; display: flex; flex-direction: column; gap: 16px; animation: in .25s ease-out; }
@keyframes in { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .screen, .shake, .pop { animation: none !important; } }

h1 { font-size: 34px; line-height: 1.05; margin: 0; text-wrap: balance; }
h2 { font-size: 24px; margin: 0; text-wrap: balance; }
p { margin: 0; line-height: 1.5; color: var(--muted); }
.eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: 12px; color: var(--accent); font-weight: 700; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.big { font-family: var(--mono); font-size: 34px; text-align: center; letter-spacing: .04em; font-variant-numeric: tabular-nums; }

button { font: inherit; color: inherit; border: 0; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn { background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 18px; padding: 15px 18px; border-radius: 14px; box-shadow: 0 4px 0 #b9801c; transition: transform .06s; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b9801c; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); box-shadow: none; }
.btn[disabled] { opacity: .45; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1; }

.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opts.one { grid-template-columns: 1fr; }
.opt { background: var(--bg-2); border: 1px solid var(--line); border-radius: 14px; padding: 14px 12px; font-size: 18px; min-height: 56px; text-align: center; }
.opt:active { background: var(--line); }
.opt.right { background: var(--good); color: #06281a; border-color: var(--good); }
.opt.wrong { background: var(--bad); color: #300; border-color: var(--bad); }

.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.key { background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; font-size: 22px; padding: 12px 0; font-family: var(--mono); }
.key:active { background: var(--line); }
.key.ok { background: var(--good); color: #06281a; border-color: var(--good); font-family: var(--font); font-weight: 700; font-size: 18px; }

.progress { display: flex; gap: 6px; }
.progress i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.progress i.done { background: var(--good); }
.progress i.now { background: var(--accent); }

.slots { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; min-height: 52px; }
.slot { width: 40px; height: 48px; border-radius: 10px; border-bottom: 3px solid var(--line); background: var(--bg-2); font-family: var(--mono); font-size: 24px; display: grid; place-items: center; }
.tiles { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.tile { width: 46px; height: 50px; border-radius: 10px; background: var(--fg); color: var(--bg); font-family: var(--mono); font-size: 24px; font-weight: 700; box-shadow: 0 3px 0 var(--muted); }
.tile[disabled] { opacity: .15; }

.guesses { display: flex; flex-direction: column; gap: 6px; max-height: 210px; overflow-y: auto; }
.guess { display: flex; gap: 6px; justify-content: center; }
.g { width: 46px; height: 46px; border-radius: 10px; display: grid; place-items: center; font-family: var(--mono); font-size: 22px; font-weight: 700; background: var(--bg-2); border: 1px solid var(--line); }
.g.hit { background: var(--good); color: #06281a; border-color: var(--good); }
.g.near { background: var(--warn); color: var(--accent-ink); border-color: var(--warn); }
.g.miss { background: #34505f; color: var(--muted); }
.legend { display: flex; gap: 14px; justify-content: center; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--c); }

.lights { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: min(100%, 300px); margin: 0 auto; }
.light { aspect-ratio: 1; max-width: 100%; border-radius: 16px; background: #1a2b36; border: 1px solid var(--line); transition: background .15s, box-shadow .15s; }
.light.on { background: var(--accent); box-shadow: 0 0 24px rgba(242,181,68,.55); border-color: var(--accent); }

.simon { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: min(100%, 300px); margin: 0 auto; }
.pad { aspect-ratio: 1; max-width: 100%; border-radius: 22px; opacity: .45; transition: opacity .1s, transform .1s; }
.pad.lit { opacity: 1; transform: scale(1.03); }
.pad:nth-child(1) { background: #4fc98a; } .pad:nth-child(2) { background: #ef6a5b; }
.pad:nth-child(3) { background: #5aa9f2; } .pad:nth-child(4) { background: #f2b544; }

.hanoi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.peg { position: relative; height: 170px; border-radius: 12px; background: var(--bg-2); border: 2px solid var(--line); display: flex; flex-direction: column-reverse; align-items: center; padding: 10px 4px; gap: 4px; }
.peg::before { content: ""; position: absolute; bottom: 10px; top: 18px; width: 6px; border-radius: 3px; background: var(--line); left: calc(50% - 3px); }
.peg.sel { border-color: var(--accent); }
.disc { position: relative; height: 24px; border-radius: 8px; }
.disc.up { transform: translateY(-10px); }
.d1 { width: 40%; background: #5aa9f2; } .d2 { width: 60%; background: #4fc98a; }
.d3 { width: 80%; background: #ef6a5b; } .d4 { width: 96%; background: #f2b544; }

.toast { position: fixed; left: 16px; right: 16px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); max-width: 448px; margin: 0 auto; padding: 14px 16px; border-radius: 14px; font-weight: 700; text-align: center; z-index: 10; }
.toast.good { background: var(--good); color: #06281a; }
.toast.bad { background: var(--bad); color: #300; }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.pop { animation: pop .3s; }
@keyframes pop { 50% { transform: scale(1.08); } }

.levels { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.lv { background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.lv b { color: var(--accent); font-family: var(--mono); }
.spacer { flex: 1; }
.center { text-align: center; }
.stars { font-size: 40px; text-align: center; color: var(--accent); letter-spacing: 6px; }
.chip.tool { min-width: 44px; min-height: 36px; font-weight: 700; font-size: 13px; letter-spacing: .06em; color: var(--fg); }
.chip.tool[hidden] { display: none; }
.chip.music { min-width: 44px; min-height: 36px; font-size: 18px; color: var(--accent); line-height: 1; }
.chip.music[aria-pressed="false"] { color: var(--line); text-decoration: line-through; }
@media (max-width: 400px) {
  #lvlLabel { display: none; }
  .chip { padding: 5px 8px; font-size: 13px; }
  .chip.tool, .chip.music { min-width: 36px; }
  .lives { font-size: 15px; letter-spacing: 0; }
}
.sheet { position: fixed; inset: 0; background: rgba(5,12,17,.7); display: flex; align-items: flex-end; justify-content: center; z-index: 30; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
.sheet-panel { width: 100%; max-width: 448px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.lang-opt { display: flex; align-items: center; gap: 14px; text-align: left; }
.lang-opt b { font-family: var(--mono); font-size: 14px; color: var(--accent); min-width: 28px; }
.lang-opt.right b { color: inherit; }
button.lv { font: inherit; text-align: left; cursor: pointer; }
button.lv:active { background: var(--line); }
button.lv .lv-st { margin-left: auto; font-size: 12px; color: var(--accent); letter-spacing: 1px; }
.hint-small { font-size: 13px; text-align: center; }
/* Conquistas: uma cor por raridade */
.r-comum { --r: #b8c4ca; } .r-incomum { --r: #4fc98a; } .r-raro { --r: #5aa9f2; }
.r-epico { --r: #b77cf2; } .r-especial { --r: #f27ab8; } .r-lendaria { --r: #f2b544; }
.ach-head { display: flex; align-items: center; gap: 10px; }
.ach-head .spacer { flex: 1; }
.ach-bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.ach-bar i { display: block; height: 100%; background: var(--accent); }
.ach-list { display: flex; flex-direction: column; gap: 16px; padding-bottom: 8px; }
.ach-group { display: flex; flex-direction: column; gap: 8px; }
.ach-group h3 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: var(--r); display: flex; justify-content: space-between; }
.ach-group h3 span { color: var(--muted); letter-spacing: 0; font-variant-numeric: tabular-nums; }
.ach { display: flex; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.ach .medal { flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; font-weight: 700; background: var(--r); color: var(--bg); }
.ach.locked { opacity: .5; }
.ach.locked .medal { background: transparent; border: 2px dashed var(--r); color: var(--r); }
.ach.got { border-color: var(--r); }
.r-lendaria.ach.got { box-shadow: 0 0 18px rgba(242,181,68,.35); }
.ach-text { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ach-text b { font-size: 16px; }
.ach-text small { color: var(--muted); font-size: 14px; line-height: 1.35; }
.ach-toasts { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 16px; right: 16px; max-width: 448px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; z-index: 20; pointer-events: none; }
.ach-toast { display: flex; gap: 12px; align-items: center; background: var(--bg-2); border: 2px solid var(--r); border-radius: 14px; padding: 10px 12px; box-shadow: 0 8px 24px rgba(0,0,0,.4); animation: drop .35s ease-out; }
.ach-toast .medal { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--r); color: var(--bg); font-weight: 700; }
.ach-toast small { display: block; color: var(--r); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; }
@keyframes drop { from { transform: translateY(-20px); opacity: 0; } to { transform: none; opacity: 1; } }
.reset-box { display: flex; flex-direction: column; gap: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
.btn.danger { background: var(--bad); color: #300; box-shadow: 0 4px 0 #a8473b; }
.btn.danger:active { box-shadow: 0 1px 0 #a8473b; }
.btn.ghost.danger-text { color: var(--bad); border-color: rgba(239,106,91,.45); }
/* 1: Encontra o diferente */
.time-bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.time-bar i { display: block; height: 100%; width: 100%; background: var(--good); transition: width .1s linear; }
.time-bar i.low { background: var(--bad); }
.odd-grid { display: grid; gap: 6px; width: min(100%, 340px); margin: 0 auto; }
.odd-cell { aspect-ratio: 1; min-width: 0; max-width: 100%; overflow: hidden; display: grid; place-items: center; padding: 18%; border-radius: 10px; background: var(--bg-2); border: 1px solid var(--line); }
.odd-cell.found { background: var(--good); border-color: var(--good); }
.odd-cell.nope { background: var(--bad); border-color: var(--bad); }
.odd-ic { width: 100%; height: 100%; display: block; }
.odd-ch { font-family: var(--mono); font-size: clamp(18px, 6vw, 28px); font-weight: 700; color: var(--fg); line-height: 1; }
/* 2: Padrões de formas */
.opts.four { grid-template-columns: repeat(4, 1fr); }
.shapes { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.shape { width: 38px; height: 38px; display: grid; place-items: center; }
.shape.slot-q { border: 2px dashed var(--accent); border-radius: 10px; color: var(--accent); font-weight: 700; font-size: 20px; }
.shape-opt { display: grid; place-items: center; padding: 10px; }
.shape-opt .shape { width: 40px; height: 40px; }
/* 6: Tubos */
.screen-part { display: flex; flex-direction: column; gap: 16px; }
.btn.ghost.switch-btn { font-size: 15px; color: var(--muted); border-style: dashed; }
.pipes-wrap { position: relative; width: min(100%, 320px); margin: 0 auto; padding: 0 18px; }
.pipes { display: grid; gap: 3px; aspect-ratio: 1; }
.pipe-cell { min-width: 0; aspect-ratio: 1; padding: 0; border-radius: 8px; background: var(--bg-2); border: 1px solid var(--line); overflow: hidden; }
.pipe { display: block; width: 100%; height: 100%; transition: transform .15s ease-out; }
.pipe svg line { stroke: #5c7889; } .pipe svg circle { fill: #5c7889; }
.pipe-cell.wet .pipe svg line { stroke: #5aa9f2; } .pipe-cell.wet .pipe svg circle { fill: #5aa9f2; }
.pipe-cell.wet { background: rgba(90,169,242,.12); }
.pipe-mark { position: absolute; transform: translateY(-50%); font-size: 14px; color: var(--muted); }
.pipe-mark.in { left: 0; } .pipe-mark.out { right: 0; }
.pipe-mark.wet { color: #5aa9f2; }
/* 8: Labirinto */
.maze { display: grid; width: min(100%, 340px); margin: 0 auto; aspect-ratio: 1; border-radius: 6px; background: var(--bg-2); touch-action: none; }
.mc { position: relative; display: grid; place-items: center; border: 2px solid transparent; }
.mc.wn { border-top-color: var(--fg); } .mc.we { border-right-color: var(--fg); }
.mc.ws { border-bottom-color: var(--fg); } .mc.ww { border-left-color: var(--fg); }
.mc.trail { background: rgba(242,181,68,.12); }
.mc.exit { background: rgba(79,201,138,.35); }
.me { width: 62%; height: 62%; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px rgba(242,181,68,.7); }
.dpad { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 56px); gap: 8px; justify-content: center; grid-template-areas: ". up ." "left down right"; }
.dpad .up { grid-area: up; } .dpad .left { grid-area: left; } .dpad .right { grid-area: right; } .dpad .down { grid-area: down; }
/* 9: Pares */
.cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: min(100%, 340px); margin: 0 auto; }
.card-t { aspect-ratio: 3 / 4; min-width: 0; border-radius: 12px; display: grid; place-items: center; font-size: 26px; font-weight: 700; color: var(--accent); background: linear-gradient(145deg, #2a4a5e, #1b3140); border: 2px solid var(--line); transition: transform .15s; }
.card-t.up { background: var(--fg); border-color: var(--fg); transform: scale(1.03); }
.card-t.done { background: rgba(79,201,138,.18); border-color: var(--good); }
/* 10: Deslizante */
.slide { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: min(100%, 280px); margin: 0 auto; }
.tile-s { aspect-ratio: 1; min-width: 0; border-radius: 14px; font-family: var(--mono); font-size: 34px; font-weight: 700; background: var(--fg); color: var(--bg); box-shadow: 0 4px 0 var(--muted); }
.tile-s.ok { background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 0 #b9801c; }
.tile-s.empty { background: transparent; box-shadow: none; border: 2px dashed var(--line); }
/* 11: Copia o desenho */
.paint { display: grid; gap: 5px; width: min(100%, 300px); margin: 0 auto; }
.px { aspect-ratio: 1; min-width: 0; border-radius: 8px; background: var(--bg-2); border: 1px solid var(--line); }
.px.on { background: #b77cf2; border-color: #b77cf2; }
.px.miss { box-shadow: inset 0 0 0 3px var(--good); }
.px.bad { box-shadow: inset 0 0 0 3px var(--bad); }
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="hud-stats" id="hud" hidden>
      <div class="lives" id="lives" aria-label="Vidas"></div>
      <div class="chip"><span id="lvlLabel">Nível</span> <b id="lvl">1</b>/<span id="lvlTotal">12</span></div>
      <div class="chip"><b id="score">0</b> pts</div>
    </div>
    <div class="hud-tools">
      <button class="chip tool" id="restartBtn" aria-label="Recomeçar o jogo" hidden>↺</button>
      <button class="chip tool" id="langBtn" aria-label="Língua">PT</button>
      <button class="chip music" id="musicBtn" aria-pressed="true" aria-label="Música de fundo">♪</button>
    </div>
  </div>
  <main id="screen" class="screen"></main>
  <div class="ach-toasts" id="achToasts" aria-live="polite"></div>
</div>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const screen = $("#screen");
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n) => shuffle(a).slice(0, n);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
};

/* ---------- Som ---------- */
let audio;
function ac() {
  audio = audio || new (window.AudioContext || window.webkitAudioContext)();
  if (audio.state === "suspended" && !document.hidden) audio.resume();
  return audio;
}
function beep(freq = 440, dur = 0.12, type = "sine") {
  try {
    ac();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.15, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
    o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + dur);
  } catch (e) {}
}
const sGood = () => { beep(660, .1); setTimeout(() => beep(880, .15), 90); };
const sBad = () => beep(160, .25, "square");

/* ---------- Música de fundo ----------
   Gerada em tempo real (sem ficheiros): baixo, acordes suaves e um arpejo
   em Lá menor, 80 bpm, ciclo de 8 compassos. */
const Music = (() => {
  const midi = n => 440 * Math.pow(2, (n - 69) / 12);
  const EIGHTH = 60 / 80 / 2;
  const BARS = [ // [baixo, notas do arpejo]
    [45, [69, 72, 76]], [41, [65, 69, 72]], [48, [67, 72, 76]], [43, [67, 71, 74]],
    [45, [69, 72, 76]], [41, [65, 69, 72]], [50, [65, 69, 74]], [40, [64, 68, 71]]
  ];
  const ARP = [0, 1, 2, 1, 0, 2, 1, 2];
  let on = true, master = null, timer = null, step = 0, next = 0;
  try { on = localStorage.getItem("enigmas-music") !== "off"; } catch (e) {}

  function voice(type, freq, t, dur, vol, attack = 0.01) {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  if (S.level === 0) u("primeira");
  if (S.level >= 5 && fullGame()) u("meio"); // a porta 7 fica aberta depois de passar a 6
  if (id === "contas" && stars === 3) u("calculadora");
  if (id === "seq" && stars === 3) u("padroes");
  if (id === "anag" && !info.hints && !info.errs) u("sempistas");
  if (id === "adiv" && stars === 3) u("adivinho");
  if (id === "cofre" && info.tries <= 4) u("arrombador");
  if (id === "cofre" && info.tries === 1) u("sorte");
  if (id === "luzes" && info.moves <= info.min) u("eletricista");
  if (id === "mem" && stars === 3) u("elefante");
  if (id === "hanoi" && info.moves === info.min) u("monge");

    id: "mem",
    play(done) {
      const tones = [392, 523, 659, 784];
      let seq = [], pos = 0, locked = true, errs = 0;
      const pads = h("div", { class: "simon" }, [0, 1, 2, 3].map(i => h("button", { class: "pad", "aria-label": t("color", i + 1), onclick: () => tap(i) })));
      const info = h("p", { class: "center" });
      const flash = (i, ms = 380) => { const p = pads.children[i]; p.classList.add("lit"); beep(tones[i], ms / 1000); setTimeout(() => p.classList.remove("lit"), ms); };
      const alive = () => document.body.contains(pads);
      function playSeq() {
        if (!alive()) return;
        locked = true; pos = 0; info.textContent = t("watch", seq.length);
        seq.forEach((c, k) => setTimeout(() => alive() && flash(c), 700 + k * 600));
        setTimeout(() => { locked = false; info.textContent = t("yourTurn"); }, 700 + seq.length * 600);
      }
      function next() { seq.push(rnd(0, 3)); playSeq(); }
      function tap(i) {
        if (locked) return;
        flash(i, 220);
        if (seq[pos] !== i) {
          locked = true; errs++; shake(pads);
          if (!loseLife(t("wrongSeq"))) setTimeout(playSeq, 1500);
          return;
        }
        pos++;
        if (pos === seq.length) {
          locked = true; addPoints(10 * seq.length);
          if (seq.length >= 6) { sGood(); return setTimeout(() => done(errs ? (errs > 1 ? 1 : 2) : 3), 600); }
          setTimeout(next, 700);
        }
      }
      seq = [rnd(0, 3), rnd(0, 3)]; setTimeout(next, 300);
      return [h("div", { class: "card" }, pads, info)];
    }
  },
  {
    id: "hanoi",
    play(done) {
      // Labirinto perfeito (só há um caminho até à saída), gerado com busca em profundidade
      const W = 8, H = 8;
      const cells = Array.from({ length: W * H }, () => ({ n: 1, e: 1, s: 1, w: 1 }));
      const DIRS = { n: [0, -1, "s"], e: [1, 0, "w"], s: [0, 1, "n"], w: [-1, 0, "e"] };
      const seen = new Set([0]), stack = [0];
      while (stack.length) {
        const c = stack[stack.length - 1], x = c % W, y = Math.floor(c / W);
        const nb = Object.entries(DIRS).map(([d, [dx, dy, o]]) => [d, x + dx, y + dy, o])
          .filter(([, nx, ny]) => nx >= 0 && ny >= 0 && nx < W && ny < H && !seen.has(ny * W + nx));
        if (!nb.length) { stack.pop(); continue; }
        const [d, nx, ny, o] = pick(nb, 1)[0], n = ny * W + nx;
        cells[c][d] = 0; cells[n][o] = 0; seen.add(n); stack.push(n);
      }
      // Caminho mais curto (BFS)
      const dist = new Map([[0, 0]]), q = [0];
      while (q.length) {
        const c = q.shift(), x = c % W, y = Math.floor(c / W);
        for (const [d, [dx, dy]] of Object.entries(DIRS)) if (!cells[c][d]) { const n = (y + dy) * W + x + dx; if (!dist.has(n)) { dist.set(n, dist.get(c) + 1); q.push(n); } }
      }
      const EXIT = W * H - 1, MIN = dist.get(EXIT);
      let pos = 0, moves = 0, over = false;
      const trail = new Set([0]);
      const board = h("div", { class: "maze", style: `grid-template-columns:repeat(${W},1fr)` });
      const info = h("p", { class: "center" });
      function draw() {
        board.replaceChildren(...cells.map((c, i) => h("div", {
          class: "mc" + (c.n ? " wn" : "") + (c.e ? " we" : "") + (c.s ? " ws" : "") + (c.w ? " ww" : "") +
            (trail.has(i) ? " trail" : "") + (i === EXIT ? " exit" : "")
        }, i === pos ? h("span", { class: "me" }) : null)));
        info.textContent = t("movesMin", moves, MIN);
      }
      function move(d) {
        if (over) return;
        if (cells[pos][d]) { shake(board); beep(180, .06, "square"); return; }
        const [dx, dy] = DIRS[d];
        pos = (Math.floor(pos / W) + dy) * W + (pos % W) + dx;
        moves++; trail.add(pos); beep(520 + (moves % 4) * 40, .04); draw();
        if (pos === EXIT) {
          over = true; sGood(); addPoints(Math.max(40, 150 - (moves - MIN) * 4));
          document.removeEventListener("keydown", onKey);
          setTimeout(() => done(moves <= MIN + 4 ? 3 : moves <= MIN * 1.6 ? 2 : 1, { moves, min: MIN }), 700);
        }
      }
      // Deslizar o dedo no labirinto
      let sx = null, sy = null;
      board.addEventListener("pointerdown", e => { sx = e.clientX; sy = e.clientY; });
      board.addEventListener("pointerup", e => {
        if (sx === null) return;
        const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
        move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "e" : "w") : (dy > 0 ? "s" : "n"));
      });
      const onKey = e => { const d = { ArrowUp: "n", ArrowRight: "e", ArrowDown: "s", ArrowLeft: "w" }[e.key]; if (d && document.body.contains(board)) { e.preventDefault(); move(d); } else if (!document.body.contains(board)) document.removeEventListener("keydown", onKey); };
      document.addEventListener("keydown", onKey);
      const pad = h("div", { class: "dpad" },
        h("button", { class: "key up", "aria-label": "↑", onclick: () => move("n") }, "▲"),
        h("button", { class: "key left", "aria-label": "←", onclick: () => move("w") }, "◀"),
        h("button", { class: "key right", "aria-label": "→", onclick: () => move("e") }, "▶"),
        h("button", { class: "key down", "aria-label": "↓", onclick: () => move("s") }, "▼"));
      draw();
      return [h("div", { class: "card" }, board, info), pad];
    }
  },
  {
    id: "pares",
    play(done) {
      // Pares escondidos: 12 cartas, 6 pares de formas coloridas
      const FACES = [["circle", "#ef6a5b"], ["triangle", "#5aa9f2"], ["square", "#4fc98a"], ["diamond", "#f2b544"], ["star", "#b77cf2"], ["circle", "#5aa9f2"], ["triangle", "#f2b544"], ["star", "#4fc98a"]];
      const PATHS = {
        circle: '<circle cx="20" cy="20" r="14"/>', triangle: '<polygon points="20,5 36,34 4,34"/>',
        square: '<rect x="7" y="7" width="26" height="26" rx="3"/>', diamond: '<polygon points="20,3 37,20 20,37 3,20"/>',
        star: '<polygon points="20,3 25,15 38,15 28,24 32,37 20,29 8,37 12,24 2,15 15,15"/>'
      };
      const MAX = 16;
      let cards, open, tries, found, busy, errs = 0;
      const grid = h("div", { class: "cards" });
      const info = h("p", { class: "center" });
      function deal() {
        const faces = pick(FACES, 6);
        cards = shuffle([...faces, ...faces]).map(f => ({ f, up: false, done: false }));
        open = []; tries = 0; found = 0; busy = false; draw();
      }
      function draw() {
        grid.replaceChildren(...cards.map((c, i) => {
          const b = h("button", { class: "card-t" + (c.up || c.done ? " up" : "") + (c.done ? " done" : ""), "aria-label": String(i + 1), onclick: () => tap(i) });
          b.innerHTML = c.up || c.done ? `<svg viewBox="0 0 40 40" width="70%" height="70%" aria-hidden="true"><g fill="${c.f[1]}">${PATHS[c.f[0]]}</g></svg>` : "?";
          return b;
        }));
        info.textContent = t("tries", tries, MAX);
      }
      function tap(i) {
        const c = cards[i];
        if (busy || c.up || c.done) return;
        c.up = true; open.push(i); beep(520, .04); draw();
        if (open.length < 2) return;
        tries++; busy = true;
        const [a, b] = open.map(k => cards[k]);
        if (a.f === b.f) {
          a.done = b.done = true; a.up = b.up = false; open = []; found++; busy = false; beep(780, .08); draw();
          if (found === 6) { sGood(); addPoints(Math.max(30, 120 - Math.max(0, tries - 6) * 6)); setTimeout(() => done(tries <= 8 ? 3 : tries <= 11 ? 2 : 1, { tries, errs }), 700); }
          return;
        }
        draw();
        setTimeout(() => {
          a.up = b.up = false; open = []; busy = false; draw();
          if (tries >= MAX) { errs++; shake(grid); if (!loseLife(t("tooManyTries"))) setTimeout(deal, 900); }
        }, 750);
      }
      deal();
      return [h("div", { class: "card" }, grid, info)];
    }
  },
  {
    id: "slide",
    play(done) {
      // Puzzle deslizante 3x3. O mínimo é calculado com uma pesquisa em largura (no máximo 181 440 estados).
      const N = 3, GOAL = "123456780";
      const nbrs = i => [i - N, i + N, i % N ? i - 1 : -1, i % N < N - 1 ? i + 1 : -1].filter(j => j >= 0 && j < N * N);
      const swap = (s, i, j) => { const a = s.split(""); [a[i], a[j]] = [a[j], a[i]]; return a.join(""); };
      let start = GOAL, e = 8, prev = -1;
      for (let k = 0; k < 40; k++) { const opts = nbrs(e).filter(j => j !== prev); const j = pick(opts, 1)[0]; start = swap(start, e, j); prev = e; e = j; }
      if (start === GOAL) start = swap(start, 7, 8);
      const minMoves = (() => {
        const seen = new Map([[start, 0]]); let q = [start];
        while (q.length) {
          const nq = [];
          for (const s of q) {
            if (s === GOAL) return seen.get(s);
            const z = s.indexOf("0");
            for (const j of nbrs(z)) { const n = swap(s, z, j); if (!seen.has(n)) { seen.set(n, seen.get(s) + 1); nq.push(n); } }
          }
          q = nq;
        }
        return 0;
      })();
      let state, moves;
      const board = h("div", { class: "slide" });
      const info = h("p", { class: "center" });
      function reset() { state = start; moves = 0; draw(); }
      function draw() {
        board.replaceChildren(...state.split("").map((ch, i) => ch === "0"
          ? h("div", { class: "tile-s empty" })
          : h("button", { class: "tile-s" + (ch === GOAL[i] ? " ok" : ""), onclick: () => tap(i) }, ch)));
        info.textContent = t("movesMin", moves, minMoves);
      }
      function tap(i) {
        if (state === GOAL) return;
        const z = state.indexOf("0");
        if (!nbrs(z).includes(i)) { beep(180, .05, "square"); return; }
        state = swap(state, z, i); moves++; beep(560, .04); draw();
        if (state === GOAL) {
          sGood(); addPoints(Math.max(30, 150 - Math.max(0, moves - minMoves) * 3)); board.classList.add("pop");
          setTimeout(() => done(moves <= minMoves + 4 ? 3 : moves <= minMoves * 2 + 6 ? 2 : 1, { moves, min: minMoves }), 700);
        }
      }
      reset();
      return [h("div", { class: "card" }, board, info), h("button", { class: "btn ghost", onclick: reset }, t("restart"))];
    }
  },
  {
    id: "pinta",
    play(done) {
      // Copia o desenho: memoriza, o desenho esconde-se, pinta de memória
      const rounds = [{ n: 4, k: 5, secs: 3 }, { n: 5, k: 7, secs: 3 }, { n: 5, k: 10, secs: 4 }];
      let i = 0, errs = 0, target, paint, phase;
      const prog = h("div", { class: "progress" }, rounds.map(() => h("i")));
      const grid = h("div", { class: "paint" });
      const info = h("p", { class: "center" });
      const check = h("button", { class: "btn", onclick: verify }, t("check"));
      function newRound() {
        const R = rounds[i];
        target = new Set(pick([...Array(R.n * R.n).keys()], R.k));
        reveal();
      }
      function reveal() {
        const R = rounds[i];
        progress(prog, i);
        phase = "show"; paint = new Set(); check.disabled = true;
        info.textContent = t("memorize");
        draw();
        setTimeout(() => { if (!document.body.contains(grid)) return; phase = "paint"; check.disabled = false; info.textContent = t("paintNow"); draw(); }, R.secs * 1000);
      }
      function draw(mark) {
        const R = rounds[i];
        grid.style.gridTemplateColumns = `repeat(${R.n}, minmax(0, 1fr))`;
        grid.replaceChildren(...Array.from({ length: R.n * R.n }, (_, k) => {
          let cls = "px";
          if (phase === "show" ? target.has(k) : paint.has(k)) cls += " on";
          if (mark && target.has(k) !== paint.has(k)) cls += target.has(k) ? " miss" : " bad";
          return h("button", { class: cls, "aria-label": String(k + 1), onclick: () => tap(k) });
        }));
      }
      function tap(k) {
        if (phase !== "paint") return;
        paint.has(k) ? paint.delete(k) : paint.add(k); beep(paint.has(k) ? 640 : 420, .04); draw();
      }
      function verify() {
        if (phase !== "paint") return;
        phase = "wait"; check.disabled = true;
        const ok = paint.size === target.size && [...target].every(k => paint.has(k));
        if (ok) {
          sGood(); addPoints(40); grid.classList.add("pop");
          setTimeout(() => { grid.classList.remove("pop"); i++; i === rounds.length ? done(errs ? (errs > 1 ? 1 : 2) : 3) : newRound(); }, 800);
        } else {
          errs++; draw(true); shake(grid);
          if (!loseLife(t("wrongDrawing"))) setTimeout(reveal, 1800);
        }
      }
      newRound();
      return [h("div", { class: "card" }, prog, grid, info), check];
    }
  },
  {
    id: "torre",
    play(done) {
      const D = 4, MIN = 2 ** D - 1;
      let pegs, sel = null, moves = 0;
      const wrap = h("div", { class: "hanoi" });
      const info = h("p", { class: "center" });
      function reset() { pegs = [[...Array(D)].map((_, k) => D - k), [], []]; sel = null; moves = 0; draw(); }
      function draw() {
        wrap.replaceChildren(...pegs.map((p, i) => h("button", { class: "peg" + (sel === i ? " sel" : ""), "aria-label": t("tower", i + 1), onclick: () => tap(i) },
          p.map((d, k) => h("div", { class: `disc d${d}` + (sel === i && k === p.length - 1 ? " up" : "") })))));
        info.textContent = t("movesMin", moves, MIN);
      }
      function tap(i) {
        if (pegs[2].length === D) return;
        if (sel === null) { if (pegs[i].length) { sel = i; beep(500, .05); } draw(); return; }
        if (sel === i) { sel = null; draw(); return; }
        const from = pegs[sel], to = pegs[i], d = from[from.length - 1];
        if (to.length && to[to.length - 1] < d) { shake(wrap); beep(200, .1, "square"); sel = null; draw(); return; }
        to.push(from.pop()); sel = null; moves++; beep(600, .05); draw();
        if (pegs[2].length === D) { sGood(); addPoints(Math.max(30, 150 - (moves - MIN) * 5)); setTimeout(() => done(moves <= MIN + 2 ? 3 : moves <= MIN + 10 ? 2 : 1, { moves, min: MIN }), 700); }
      }
      reset();
      return [h("div", { class: "card" }, wrap, info), h("button", { class: "btn ghost", onclick: reset }, t("restart"))];
    }
  }
];
const lvName = L => T.levels[L.id][0], lvTag = L => T.levels[L.id][1], lvIntro = L => T.levels[L.id][2];

/* ---------- Ecrãs ---------- */
function home() {
  $("#hud").hidden = true;
  showRestart(false);
  view(() => {
    const b = best.get();
    show(
      h("div", { class: "eyebrow" }, t("homeEyebrow")),
      h("h1", {}, t("title")),
      h("p", {}, t("homeText")),
      h("div", { class: "levels" }, LEVELS.map((l, i) =>
        h("button", { class: "lv", "aria-label": `${i + 1}. ${lvName(l)}`, onclick: () => start(i) }, h("b", {}, String(i + 1)), lvTag(l)))),
      h("p", { class: "hint-small" }, t("pickLevel")),
      b ? h("p", { class: "center" }, t("best", b)) : null,
      h("div", { class: "spacer" }),
      h("button", { class: "btn", onclick: () => start(0) }, t("start")),
      achBtn()
    );
  });
}
/* Começa um jogo na porta indicada (0 = desde o início) */
function start(from = 0) {
  S.gameId++; S.from = from; S.level = from; S.score = 0; S.lives = 3; S.stars = []; S.result = null;
  beep(520, .08); Ach.gameStarted(); intro();
}
function intro() {
  hud();
  view(() => {
    const L = LEVELS[S.level];
    show(
      h("div", { class: "spacer" }),
      h("div", { class: "eyebrow" }, t("door", S.level + 1, lvTag(L))),
      h("h1", {}, lvName(L)),
      h("p", {}, lvIntro(L)),
      h("div", { class: "spacer" }),
      h("button", { class: "btn", onclick: play }, t("openDoor"))
    );
  });
}
function play() {
  // Durante um nível não se muda de língua (o conteúdo já foi sorteado)
  S.view = null; $("#langBtn").hidden = true;
  const L = LEVELS[S.level];
  let finished = false;
  const gid = S.gameId;
  show(h("div", { class: "eyebrow" }, lvTag(L)), h("h2", {}, lvName(L)));
  const nodes = L.play((stars, info) => { if (finished || S.lives <= 0 || gid !== S.gameId) return; finished = true; S.stars[S.level] = stars; levelDone(stars); levelAchievements(L.id, stars, info); });
  screen.append(...nodes);
}
function levelDone(stars) {
  const last = S.level === LEVELS.length - 1;
  view(() => show(
    h("div", { class: "spacer" }),
    h("div", { class: "eyebrow center" }, t("doorOpened", S.level + 1)),
    h("div", { class: "stars pop" }, "★".repeat(stars) + "☆".repeat(3 - stars)),
    h("h1", { class: "center" }, stars === 3 ? t("perfect") : stars === 2 ? t("great") : t("done")),
    h("p", { class: "center" }, t("youHave", S.score)),
    h("div", { class: "spacer" }),
    h("button", { class: "btn", onclick: () => { if (last) win(); else { S.level++; intro(); } } }, last ? t("leave") : t("nextDoor"))
  ));
}
/* Calcula o resultado uma vez; o ecrã pode ser redesenhado noutra língua.
   Só um jogo começado na porta 1 conta para o recorde. */
function finale(won) {
  const total = S.score + (S.lives > 0 ? S.lives * 50 : 0);
  const prev = best.get(); if (fullGame() && total > prev) best.set(total);
  S.score = total; hud();
  S.result = { won, total, prev, full: fullGame(), from: S.from + 1, lives: S.lives, door: S.level + 1, stars: S.stars.reduce((a, b) => a + (b || 0), 0) };
  showRestart(false);
  view(renderFinale);
}
function renderFinale() {
  const R = S.result;
  show(
    h("div", { class: "spacer" }),
    h("h1", { class: "center" }, R.won ? t("winTitle") : t("loseTitle")),
    h("p", { class: "center" }, R.won ? (R.full ? t("winText") : t("winFromText", R.from)) : t("loseText", R.door, LEVELS.length)),
    h("div", { class: "card" },
      h("div", { class: "big" }, `${R.total} pts`),
      h("p", { class: "center" }, t("starsLine", R.stars, LEVELS.length * 3) + (R.lives > 0 ? t("livesBonus", R.lives * 50) : "")),
      R.full && R.total > R.prev ? h("p", { class: "center", style: "color:var(--accent);font-weight:700" }, t("newRecord")) : h("p", { class: "center" }, t("record", Math.max(R.prev, best.get())))),
    h("div", { class: "spacer" }),
    h("button", { class: "btn", onclick: () => start(0) }, t("playAgain")),
    h("button", { class: "btn ghost", onclick: home }, t("mainMenu")),
    achBtn()
  );
}
function win() {
  sGood(); setTimeout(sGood, 250);
  const lives = S.lives, stars = S.stars.reduce((a, b) => a + (b || 0), 0), full = fullGame();
  finale(true);
  if (!full) return; // as conquistas do jogo completo só contam começando na porta 1
  Ach.unlock("livre");
  if (lives === 3) Ach.unlock("arranhao");
  if (lives === 1) Ach.unlock("fio");
  if (stars === LEVELS.length * 3) Ach.unlock("mestre");
  if (S.score >= 1300) Ach.unlock("brilhante");
}
function gameOver() { Ach.unlock("preso"); if (fullGame() && S.score >= 1300) Ach.unlock("brilhante"); finale(false); }

applyLang();
home();
</script>
