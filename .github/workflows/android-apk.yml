name: Construir APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Construir APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: eu-brinco-ao-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Guardar APK no repositorio
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/eu-brinco-ao.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/eu-brinco-ao.apk
          git commit -m "APK gerado automaticamente" || exit 0
          git push
