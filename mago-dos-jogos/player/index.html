<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Jogo</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #made{position:fixed;left:0;right:0;bottom:max(6px,env(safe-area-inset-bottom));text-align:center;font:600 11px system-ui,sans-serif;color:rgba(255,255,255,.55);pointer-events:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="made">Criado com Mago dos Jogos</div>
<script src="engine.js"></script>
<script src="game.js"></script>
<script>
  document.title = GAME.name;
  let game = MDJ.run(document.getElementById('cv'), GAME, { top: 8, onOver: function () {} });
  setTimeout(function () { document.getElementById('made').style.display = 'none'; }, 4000);
  window.mdjPause = function () { game.pause(); };
  window.mdjResume = function () { game.resume(); };
  window.mdjBack = function () { return false; };
</script>
</body>
</html>
