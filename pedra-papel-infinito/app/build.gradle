plugins {
    id 'com.android.application'
}

android {
    namespace 'pt.widgilabs.pedrapapelinfinito'
    compileSdk 34

    defaultConfig {
        applicationId 'pt.widgilabs.pedrapapelinfinito'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Assinado com a chave de debug para poder ser instalado diretamente.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
